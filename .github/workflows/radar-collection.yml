name: Australia Policy Radar source diagnostics
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare public Queensland news index to the official page
        shell: bash
        run: |
          curl --fail --location --silent --show-error --max-time 25 \
            'https://news.google.com/rss/search?q=site%3Awww.migration.qld.gov.au%2Fnews&hl=en-AU&gl=AU&ceid=AU%3Aen' \
            -o "$RUNNER_TEMP/queensland-news.xml"
          python3 - "$RUNNER_TEMP/queensland-news.xml" <<'PY'
          import json
          import sys
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          items = ET.parse(sys.argv[1]).findall("./channel/item")
          accepted = []
          for item in items:
              source = item.find("source")
              if source is not None and urlparse(source.get("url", "")).hostname in {"migration.qld.gov.au", "www.migration.qld.gov.au"}:
                  accepted.append(item)
          headline = next((item.findtext("title") for item in accepted if "2026-27 SNMP now published" in item.findtext("title", "")), None)
          archive = next((item.findtext("pubDate") for item in accepted if "State Nominated Migration Program Allocation" in item.findtext("title", "") and "2024" in item.findtext("title", "")), None)
          domains = sorted({urlparse(item.findtext("link", "")).hostname or "" for item in accepted})
          print("RADARPROBE " + json.dumps({"items": len(items), "publisher_matches": len(accepted), "known_announcement": headline, "archive_index_date": archive, "item_link_domains": domains}, ensure_ascii=False))
          if not headline:
              sys.exit("The indexed feed did not contain the known Queensland announcement")
          PY
          official=$(curl --location --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' 'https://www.migration.qld.gov.au/news')
          echo "RADARPROBE official_news_http=$official"
