name: Australia Policy Radar collection

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
    inputs:
      qld_leads_only:
        description: Collect Queensland Google News review leads only
        type: boolean
        default: false
      retry_failed:
        description: Retry degraded official sources only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: radar-official-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        id: dependencies
      - name: Collect Queensland Google News leads
        if: ${{ !inputs.retry_failed || inputs.qld_leads_only }}
        run: |
          node scripts/seed.ts --source qld-google-news-leads
          node scripts/collect-qld-news-leads.ts
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.RADAR_DATABASE_URL }}
          COLLECT_ENABLED: 'true'
          MODEL_CALLS_ENABLED: 'false'
      - name: Collect official sources
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && !inputs.qld_leads_only }}
        run: node scripts/collect-official-once.ts ${{ inputs.retry_failed && '--retry-failed' || '' }}
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.RADAR_DATABASE_URL }}
          RADAR_AU_COLLECTOR_ORIGIN: ${{ vars.RADAR_AU_COLLECTOR_ORIGIN }}
          RADAR_AU_COLLECTOR_KEY: ${{ secrets.RADAR_AU_COLLECTOR_KEY }}
          COLLECT_ENABLED: 'true'
          MODEL_CALLS_ENABLED: 'false'
