name: Australia Policy Radar collection

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-official-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Collect official sources
        run: node scripts/collect-official-once.ts
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.RADAR_DATABASE_URL }}
          COLLECT_ENABLED: 'true'
          MODEL_CALLS_ENABLED: 'false'
