name: Australia Policy Radar source diagnostics
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe official endpoints
        shell: bash
        run: |
          probe() {
            local name="$1" url="$2" marker="$3" output="$(mktemp)"
            local result
            result="$(curl --location --connect-timeout 10 --max-time 30 --silent --show-error --user-agent 'Mozilla/5.0 (compatible; PolicyRadar/1.0)' --header 'Accept-Language: en-AU,en;q=0.9' --output "$output" --write-out '%{http_code} %{remote_ip} %{size_download} %{url_effective}' "$url" 2>&1)" || true
            local match=no
            if grep -aiqE "$marker" "$output"; then match=yes; fi
            echo "RADARPROBE $name [$result] content=$match"
          }
          probe edu https://www.education.gov.au/managed-system-international-education/resources/visa-prioritisation-status 'current.snapshot' &
          probe edu-doc https://www.education.gov.au/download/19465/visa-prioritisation-status/46509/current-snapshot/docx 'word/' &
          probe edu-alt https://internationaleducation.gov.au/Research/Pages/default.aspx 'Education' &
          probe tra https://www.tradesrecognitionaustralia.gov.au/fees-1 'assessment service fees' &
          probe tra-program https://www.tradesrecognitionaustralia.gov.au/our-programs/job-ready-program '2,845|490' &
          probe qld https://migration.qld.gov.au/news 'stories-list' &
          probe qld-www https://www.migration.qld.gov.au/news 'stories-list|story-wrapper' &
          probe tiq https://www.tiq.qld.gov.au/queensland-business/news-and-events/news 'news' &
          probe tga https://training.gov.au/organisation/details/90003 '_nuxt' &
          probe tra-reader https://r.jina.ai/https://www.tradesrecognitionaustralia.gov.au/fees-1 'Job Ready' &
          probe edu-reader https://r.jina.ai/https://www.education.gov.au/managed-system-international-education/resources/visa-prioritisation-status 'Current Snapshot' &
          probe edu-pdf-reader https://r.jina.ai/https://www.education.gov.au/download/19465/visa-prioritisation-status/46510/current-snapshot/pdf 'Progress Against Indicative Allocations' &
          probe qld-reader https://r.jina.ai/https://migration.qld.gov.au/news 'SNMP|State Nominated Migration Program' &
          probe tga-api https://training.gov.au/api/organisation/90003 '"code":"90003"' &
          probe tga-scope https://training.gov.au/api/organisation/90003/scopesummary 'trainingPackage|qualifications' &
          wait
